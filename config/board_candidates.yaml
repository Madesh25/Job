# Proposed job board links for Target Companies (FETCH 13). Check them on your PC (writes
# nothing to Notion):
#   python -m jobengine.sweep --check-boards
# A company named here is checked with this link instead of its Careers URL. The links that
# work are then copied into Target Companies (Careers URL and ATS platform, with your OK) and
# taken out of this file. Names must match the Company column exactly.
#
# Rounds 1 to 4 (5 Oct): 44 links worked and are in Target Companies (Dell last, on its
# Oracle site). Companies with their own job site are listed in sweep.ats.own_site_companies
# (config/base.yaml, your choice C of 5 Oct). Nothing is waiting for a check now.
proposed: {}

# New companies for Target Companies (10 Oct): mid-size companies, scale-ups and startups
# that hire DevOps, SRE and platform engineers in Poland, the Netherlands or Ireland (or
# remote in Europe), each with a job board /fetch can read or a careers page that may link
# to one. --check-boards checks them too ("new" in the report); the ones that work are added
# to Target Companies (Active, with the board link as Careers URL) and taken out of here.
# Big companies already in Target Companies are not repeated. Polish startups that post
