safety:
  redirect_to: "madeshwaranm02@gmail.com"
  dev_sender: "madeshwaranm02@gmail.com"
  prod_sender: "madeshwaran.manikam@gmail.com"
  # Every HTTP request made through jobengine.http must go to one of these hosts.
  # linkedin hosts are refused even if listed here.
  allowed_hosts:
    - api.notion.com
    - api.adzuna.com
    - boards-api.greenhouse.io
    - api.lever.co
    - api.eu.lever.co
    - api.smartrecruiters.com
    - api.ashbyhq.com
    # Dell's Oracle Cloud HCM career site on its own domain (5 Oct)
    - enterpriseplatform.dell.com
    - jooble.org
    - www.amazon.jobs
    - ind.nl
    - api.apollo.io
    - api.hunter.io
    - api.snov.io
    - api.prospeo.io
    - api.tomba.io
    - api.github.com
    - api.lusha.com
  # Any subdomain of these (Workday boards are <tenant>.<wdN>.myworkdayjobs.com).
  allowed_host_suffixes:
    - myworkdayjobs.com
    # Oracle Cloud HCM career sites (<tenant>.fa.<region>.oraclecloud.com)
    - oraclecloud.com
screening:
  # Your experience window: jobs asking for more years than this are not saved by the sweep
  # and are skipped by screening before any AI call. Senior titles count as too senior
  # unless the posting asks for years within this limit.
  max_years_required: 4
  # A required tool you do not have (not in Skills Inventory or Term Map): false lists it in
  # Gaps and the job is still judged (your decision of 1 Oct); true skips the job as
  # "Tech mismatch" (the V16 gate 4).
  tech_mismatch_skips: false
  # Jobs sent to the LLM at the same time (after the first one succeeds).
  workers: 4
  # A description shorter than this (or marked "(snippet only)") is a snippet (spec section 3).
  full_min_chars: 600
  # At most this many jobs go to the LLM per day (all runs together; newest posting first).
  # Rows without a description do not count. /screen <url> and /jd always run and count.
  daily_limit: 30
  # /jd collects pasted messages for this long before the capture is discarded.
  jd_capture_minutes: 20
  # /autopilot approves at most this many Apply high and Apply normal jobs a day (best first);
  # the rest stay in /pending. While its half-price batch works, the bot (long polling) checks
  # it every autopilot_check_minutes and carries on by itself when the answers are in.
  autopilot_approvals: 10
  autopilot_check_minutes: 5
  # Scheduled /autopilot (off until Notion Config schedule.autopilot is true): once a day at
  # `time` in `timezone` on `days`. A bot that is off then starts it until `latest`, never
  # later. Notion Config schedule.autopilot_time ("HH:MM") wins over `time`.
  autopilot_schedule:
    time: "07:00"
    latest: "10:00"
    timezone: Europe/Warsaw
    days: [Mon, Tue, Wed, Thu, Fri]
  # /jd writes the pasted text in blocks of this size, at most this many blocks.
  block_chars: 2000
  max_blocks: 90
apply_pack:
  # Ready answers for portal forms, one Telegram message per approved job (apply/pack.py).
  # Your answers (PR 11); a Notion Config key apply.<name> wins over each one.
  sponsorship_needed: "Yes"
  authorized_without_sponsorship: "No"
  notice_period: "90 days, can be shortened to 30 to 40 days"
  earliest_start: "About 3 months after the offer, including the work permit"
  expected_salary: "Open, any range at or above the visa minimum"
  current_salary: "Prefer not to say"
  experience: "4 years overall, 3 years in DevOps"
  education: "Mechanical Engineering"
  english: "C1 (only where the form requires a level)"
  other_languages: "None"
  relocation: "Open to relocate at my own cost; relocation support is welcome"
  interviews: "Any time"
  gender: "Male"
  other_diversity: "Prefer not to say"
  why_template: "The role's focus on {detail} is close to my day-to-day work at Xerago."
  # Per country: the work permit line and the visa salary minimum (2026 figures; check each
  # year: IND and DETE publish new amounts every January and March).
  countries:
    Poland:
      permit: "I need a Polish work permit (type A); the employer applies, usually 1 to 3
        months."
      salary_floor: "No visa salary minimum (the work permit follows the local pay level)"
    Netherlands:
      permit: "I qualify as a Highly Skilled Migrant; a recognised IND sponsor can hire me
        without a labour market test."
      salary_floor: "EUR 4,357 a month gross, about EUR 52,300 a year before holiday pay
        (Highly Skilled Migrant minimum under 30, 2026)"
    Ireland:
      permit: "I need an Irish employment permit. DevOps is on the Critical Skills Occupations
        List, so a General Employment Permit needs no labour market test."
      salary_floor: "EUR 36,605 a year (General Employment Permit minimum from March 2026)"
resume:
  # Defaults; Notion Config keys with the same names (resume.fill_min, ...) win when set.
  fill_min: 88
  fill_max: 96
  max_revisions: 5
  gate_retries: 2
  max_words_per_bullet: 8
  max_words_total: 25
  # Words allowed around a backed term in an inserted chunk (resume.gate.connector_words).
  # One string: in a YAML list the word "on" would be read as true.
  connector_words: "and with using for on in the a an via to of across including through into by
    its their"
  out_dir: out
  # Per job (resume/header.py): the headline's first part becomes the job's title when it is
  # one of these (your approved titles), and the relocation line names the job's place.
  # Config keys resume.headline_titles and resume.relocation_template win when set.
  headline_titles: "DevOps Engineer, Site Reliability Engineer, Platform Engineer, Cloud Engineer,
    Infrastructure Engineer, Kubernetes Engineer"
  # {place} = the job's city and country, {city}, {country}. One line in the resume: a "\n"
  # (or " | ") separates the parts.
  relocation_template: "Chennai, India | Open to relocate to {country}"
contacts:
  # Title patterns (lowercase regex), checked in this order. Anything else is Other.
  title_patterns:
    recruiter: "recruit|talent acquisition|sourcer|talent partner|people partner|hr business partner|rekrut|\\bhr\\b|human resources|people (operations|ops)|talent (manager|lead|specialist)|kadr"
    hiring: "engineering manager|head of (devops|platform|infrastructure|cloud|sre|engineering)|director of (engineering|infrastructure|platform)|(devops|platform|infrastructure|sre|cloud) (team )?(lead|manager)|tech lead|team lead"
    peer: "devops|site reliability|sre|platform engineer|cloud engineer|infrastructure engineer|systems engineer|kubernetes|release engineer|build engineer"
  # Used when Config contacts.mix is missing or cannot be read.
  default_mix: {peer: 2, hiring: 1, recruiter: 1}
  cache_months: 6
  personal_domains: [gmail.com, outlook.com, yahoo.com, hotmail.com, icloud.com, proton.me]
  generic_mailboxes: [careers, jobs, hr, recruitment, talent, praca, rekrutacja]
  # Never used as a company's email domain.
  ats_hosts: [greenhouse.io, lever.co, smartrecruiters.com, myworkdayjobs.com, workday.com,
              teamtailor.com, recruitee.com, personio.de]
  # Title keywords sent to providers per slot type.
  search_titles:
    peer: [DevOps Engineer, Site Reliability Engineer, Platform Engineer, Cloud Engineer]
    hiring: [Engineering Manager, Head of Platform, Head of DevOps, Infrastructure Manager]
    recruiter: [Recruiter, Talent Acquisition, Technical Recruiter]
  # Engineers from the company's public GitHub organisation (free; on when Notion Config
  # contacts.github is "on"). At most this many member profiles are read per job.
  github:
    max_profiles: 20
tracking:
  # Gmail label names (Module 07). Labels are applied, never created: make them in Gmail.
  labels:
    replies: JobSearch/Replies
    applications: JobSearch/Applications
    interviews: JobSearch/Interviews
  # Defaults; Notion Config tracking.min_confidence, followup.days, ghosted.days and
  # contacts.retention_months win when set.
  min_confidence: 0.8
  followup_days: 7
  ghosted_days: 14
  # A contact who never answered becomes Status "Dead end" after this many mails (first mails
  # and follow-ups, all jobs) and is never mailed again. Notion Config contacts.dead_end_after
  # wins when set. Someone who answered (Contacts "Replied" ticked) is reused for new jobs.
  dead_end_after: 5
  retention_months: 12
  # Instant reply ping (track/ping.py): the inbox is searched this often for replies from
  # contacts and employers; each new one is sent to Telegram at once (no AI, no Notion write).
  reply_check_minutes: 15
  first_run_days: 14
  overlap_days: 1
  ats_sender_domains: [greenhouse.io, lever.co, smartrecruiters.com, myworkday.com, workday.com,
                       teamtailor.com, recruitee.com, personio.de, successfactors.com, icims.com]
  opt_out_phrases: ["do not contact", "remove me", "unsubscribe", "not interested, please stop",
                    "nie kontaktuj"]
strategy:
  # Defaults; Notion Config strategy.max_tips and strategy.max_searches win.
  max_tips: 8
  max_searches: 8
  # Myths that are logged as Rejected automatically (case-insensitive substring or regex).
  reject_patterns:
    - keyword stuffing
    - stuff (the )?(resume|cv) with keywords
    - (white|hidden|invisible) text
    - ats score
    - ats (checker|scanner|scoring tool)
    - resume score
    - (copy|paste|mirror)(ing)? the (whole|entire|full) job (description|posting|ad)
    - fake experience
    - (invent|fabricat|exaggerat)\w* (your |a )?(experience|skills?|titles?|metrics?)
    - mass (apply|applying|applications?)
    - same (cv|resume|mail|email|message) to (every|all|hundreds)
    - tracking pixels?
    - (email|mail) tracking
    - read receipts?
  # Similar tip text at or above this rapidfuzz ratio is a duplicate.
  duplicate_ratio: 85
drive:
  resume_folder: Job Engine Resumes
mail:
  # Defaults; Notion Config keys mail.same_person_cooldown_days and mail.max_attachment_kb win.
  same_person_cooldown_days: 30
  max_attachment_kb: 250
  # Mail mode send: a checked mail goes out only in the recipient's morning (the job's
  # country); outside it the draft waits in /mailqueue and is sent by itself, one every few
  # minutes, after the same checks. Notion Config mail.send_window = off sends at once.
  # Mail warm-up (mail/warmup.py): the daily send cap per week of sending, from the first
  # mail the bot sends. Notion Config mail.daily_send_cap is the ceiling; mail.warmup = off.
  warmup:
    steps: [10, 15, 20, 25, 30]
  send_window:
    enabled: true
    days: [Tue, Wed, Thu]
    start: "08:00"
    end: "10:00"
sweep:
  # LinkedIn alert jobs have no description (LinkedIn is never read). After each sweep the
  # same company, title and country is looked up among the other sources' postings and its
  # description is written to the LinkedIn row (sweep/crossmatch.py). At most max_pages
  # job pages are read for it when the match has only a snippet.
  crossmatch:
    enabled: true
    max_pages: 10
  # Network work done at the same time: the sources, careers pages, job boards and job
  # pages. Notion writes stay at about 3 per second whatever this is.
  workers: 8
  # At most this many NEW jobs are saved per day (all sweeps together); 0 = no limit.
  # Your decision of 30 Sep: every job that passes the rules is saved (none is lost to a
  # daily limit). New postings are ranked by a free match score (sweep/rank.py, no LLM) and
  # screening takes the best screening.daily_limit (30) first: today's /pending list.
  daily_new_limit: 0
  # Remote jobs open in one of these regions ("Remote, EU") are kept as Country Other,
  # City Remote. Remote jobs that name only other countries are still left out.
  remote_regions: [eu, europe, european union, emea]
  # Title filters (section 4). Matched as whole words on the canonical (lowercase ASCII) title.
  title_include:
    - devops
    - sre
    - site reliability
    - platform engineer
    - cloud engineer
    - infrastructure engineer
    - infra engineer
    - kubernetes
    - systems engineer
    - build engineer
    - release engineer
    - devsecops
    - cloud ops
    - cloudops
  title_exclude:
    - lead
    - principal
    - head of
    - director
    - manager
    - architect
    - staff
    - vp
    - vice president
    - intern
    - internship
    - student
  # Country -> names and cities. City keys are the display names written to Notion;
  # aliases are canonical (lowercase ASCII, as produced by normalize.canon).
  locations:
    Poland:
      names: [poland, polska]
      cities:
        # LinkedIn sometimes names the county around the city ("Krakowski (Hybrid)", 8 Oct).
        Warszawa: [warszawa, warsaw, warszawski]
        Kraków: [krakow, cracow, krakowski]
        Wrocław: [wroclaw, wroclawski]
        Poznań: [poznan, poznanski]
        Gdańsk: [gdansk, gdanski]
        Łódź: [lodz, lodzki]
        Katowice: [katowice]
        Gdynia: [gdynia]
        Lublin: [lublin]
        Szczecin: [szczecin]
        Bydgoszcz: [bydgoszcz]
        Białystok: [bialystok]
        Rzeszów: [rzeszow]
        Gliwice: [gliwice]
        Toruń: [torun]
        Opole: [opole]
        Kielce: [kielce]
        Olsztyn: [olsztyn]
        Bielsko-Biała: [bielsko biala]
        Sopot: [sopot]
        Częstochowa: [czestochowa]
        Radom: [radom]
        Zielona Góra: [zielona gora]
        Tychy: [tychy]
        Zabrze: [zabrze]
        Sosnowiec: [sosnowiec]
        Mysłowice: [myslowice]
        Dąbrowa Górnicza: [dabrowa gornicza]
    Netherlands:
      names: [netherlands, nederland]
      cities:
        Amsterdam: [amsterdam]
        Amstelveen: [amstelveen]
        Utrecht: [utrecht]
        Rotterdam: [rotterdam]
        Den Haag: [den haag, the hague, s gravenhage]
        Eindhoven: [eindhoven]
        Almere: [almere]
        Alkmaar: [alkmaar]
        Leeuwarden: [leeuwarden]
        Zeist: [zeist]
        Delft: [delft]
        Leiden: [leiden]
        Haarlem: [haarlem]
        Hoofddorp: [hoofddorp, schiphol]
        Groningen: [groningen]
        Nijmegen: [nijmegen]
        Arnhem: [arnhem]
        Breda: [breda]
        Den Bosch: [den bosch, s hertogenbosch]
        Tilburg: [tilburg]
        Zwolle: [zwolle]
        Enschede: [enschede]
        Hilversum: [hilversum]
        Amersfoort: [amersfoort]
        Apeldoorn: [apeldoorn]
        Veenendaal: [veenendaal]
        Maastricht: [maastricht]
        Deventer: [deventer]
        Nieuwegein: [nieuwegein]
        # Added 6 Oct (Dronten was "place not recognised" in the Phase 4 /fetch).
        Dronten: [dronten]
        Lelystad: [lelystad]
        Veldhoven: [veldhoven]
        Son en Breugel: [son en breugel]
        Helmond: [helmond]
        Capelle aan den IJssel: [capelle aan den ijssel]
        Rijswijk: [rijswijk]
        Zoetermeer: [zoetermeer]
        Diemen: [diemen]
        Houten: [houten]
        Woerden: [woerden]
        Ede: [ede]
        Wageningen: [wageningen]
        Gouda: [gouda]
        Dordrecht: [dordrecht]
        Heerlen: [heerlen]
        Venlo: [venlo]
        Hengelo: [hengelo]
        Oss: [oss]
        Harderwijk: [harderwijk]
    Ireland:
      names: [ireland]
      cities:
        Dublin: [dublin]
        Cork: [cork]
        Galway: [galway]
        Limerick: [limerick]
        Waterford: [waterford]
        Wicklow: [wicklow]
        Kildare: [kildare, naas, maynooth]
        Athlone: [athlone]
        Sligo: [sligo]
        Kerry: [kerry, tralee, killarney]
        Shannon: [shannon]
        Letterkenny: [letterkenny]
        Dundalk: [dundalk]
        Drogheda: [drogheda]
        Kilkenny: [kilkenny]
        Carlow: [carlow]
  gmail:
    # Alert emails read on each /fetch: those with this Gmail label (put every job alert under
    # it with Gmail filters), plus those from a sender domain in sender_boards below, from the
    # last `days` days. The label works whatever address a board sends from. A `query` key,
    # when set, replaces the whole search.
    label: "Job Alerts"
    days: 2
    max_messages: 100
    # Sender domain (or parent domain) -> Board option in Job Opportunities.
    sender_boards:
      linkedin.com: LinkedIn
      justjoin.it: JustJoin IT
      nofluffjobs.com: NoFluffJobs
      pracuj.pl: Pracuj.pl
      theprotocol.it: theprotocol.it
      bulldogjob.pl: Bulldogjob
      indeed.com: Indeed
      iamexpat.nl: IamExpat
      nationalevacaturebank.nl: Nationale Vacaturebank
      irishjobs.ie: IrishJobs.ie
      jobs.ie: Jobs.ie
      jobsireland.ie: JobsIreland
    # Boards that only list one country's jobs: that country is used when a card names only a
    # city, or no place at all. LinkedIn and Indeed list every country, so they are not here.
    board_country:
      JustJoin IT: Poland
      NoFluffJobs: Poland
      Pracuj.pl: Poland
      theprotocol.it: Poland
      Bulldogjob: Poland
      IrishJobs.ie: Ireland
      Jobs.ie: Ireland
      JobsIreland: Ireland
      IamExpat: Netherlands
      Nationale Vacaturebank: Netherlands
    # Board -> job link pattern. The last capturing group is the posting ID.
    # These are only used to recognise links inside emails; links are never requested.
    job_url_patterns:
      LinkedIn: 'linkedin\.com/(comm/)?jobs/view/(\d+)'
      JustJoin IT: 'justjoin\.it/(job-offer|offers)/([\w-]+)'
      NoFluffJobs: 'nofluffjobs\.com/(pl/)?job/([\w-]+)'
      Pracuj.pl: 'pracuj\.pl/praca/.*,oferta,(\d+)'
    # Order of the first lines when one link holds the whole job card (default: title, then
    # "Company · Place"). JustJoin IT cards start with the company and the city.
    card_layouts:
      JustJoin IT: [company, place, title]
    # Whole link texts that are never job titles (IrishJobs puts "more" under every card).
    ignore_link_exact:
      - more
      - new
      - contact us
      - change criteria for jobs by email
      - see all matching jobs
      - show job offers
      # Indeed "match" emails (8 Oct): feedback buttons, not job titles
      - view job
      - view jobs
      - this is a bad match
      - this is a good match
      - 'yes'
      - 'no'
      - not interested
    # Anchor texts that are never job titles (generic fallback for other boards).
    ignore_link_texts:
      - unsubscribe
      - view all
      - see all
      - settings
      - manage
      - preferences
      - privacy
      - help
      - terms
      - log in
      - sign in
      - download
      - app store
      - google play
      # Polish buttons (Pracuj.pl, theprotocol.it, JustJoin IT)
      - zobacz
      - ustawienia
      - wypisz
      - zrezygnuj
      - prywatno
      - pomoc
      - zaloguj
  # New jobs are only saved when their posting is at most this many days old: 0 is today
  # only, 1 today and yesterday, 2 the last 3 days (a job posted after a /fetch is not lost).
  # Jobs without a posted date are kept. Rows already in Notion are still updated.
  max_posted_age_days: 2
  # Skill match: of the tools a new job names (your Skills Inventory and Term Map, plus the
  # common tools in sweep/rank.py), at least this share must be yours, or it is not saved.
  # Jobs naming fewer than min_skill_terms tools are kept (too little to judge).
  min_skill_match: 0.6
  min_skill_terms: 4
  adzuna:
    countries: [pl, nl]
    # Adzuna results carry no currency field; each country endpoint reports salaries
    # in that country's currency.
    currency:
      pl: PLN
      nl: EUR
    results_per_page: 50
    max_days_old: 3
    what_or: "devops sre kubernetes platform cloud infrastructure devsecops"
    max_calls_per_run: 12
  ats:
    # Company career sites list only jobs that are still open: their new jobs are saved when
    # posted in the last this many days (your decision of 5 Oct), not only the last 3 days.
    max_posted_age_days: 20
    # SmartRecruiters detail calls per run (each gives one full description).
    max_detail_calls: 20
    # Workday: one search per term (20 results each), then a detail call per kept posting.
    workday_detail_calls: 40
    workday_pages_per_term: 1
    # Searches for boards too big to read whole (Workday, amazon.jobs).
    search_terms: [devops, site reliability, sre, platform engineer, cloud engineer, kubernetes,
                   infrastructure engineer, devsecops]
    # Companies whose careers URL is their own site: the careers page is read to find the
    # ATS it links to. Cached in bot_state "ats.detected" and checked again after this long.
    detect_every_days: 7
    max_detect_per_run: 25
    # Companies with their own job site and no public job list /fetch can read (board
    # checks of 5 Oct; your choice C): they stay in Target Companies for contacts and
    # referrals, their jobs come from your alerts, and the sweep neither looks for their job
    # board nor lists them under "No job board found" (one count line instead). Names
    # without the country suffix: "Infosys" covers Infosys, Infosys (IE) and Infosys (NL).
    # A company whose Careers URL is a readable board is read anyway.
    own_site_companies: [Google, Meta, Apple, IBM, Microsoft, Infosys, TCS,
                         Tata Consultancy Services (TCS), Tech Mahindra, LTIMindtree,
                         Cognizant, Ericsson, Booking.com, ASML, EPAM Systems, Comarch,
                         Asseco Poland, Samsung R&D, bunq, Uber, Version 1, Brainly, KPMG,
                         UBS, Revolut, Rabobank, Goldman Sachs, ABN AMRO, SAP, HSBC,
                         Deloitte]
  # Company name -> {ats, token} for companies whose careers URL is their own domain and whose
  # board is not found automatically. Workday also needs host and site.
  ats_boards: {}
  # Jooble job search (needs JOOBLE_API_KEY, free): many job boards, Ireland included.
  # One call per country and term, results_per_page each.
  jooble:
    enabled: true
    countries: [Ireland, Poland, Netherlands]
    search_terms: [devops engineer, site reliability engineer, platform engineer, cloud engineer,
                   kubernetes engineer, infrastructure engineer, devsecops engineer]
    results_per_page: 50
  # NoFluffJobs (FETCH 4, sweep/sources/nofluffjobs.py): the public search page, newest first,
  # `pages` pages per search term, one request a second, robots.txt respected. Poland only.
  nofluffjobs:
    enabled: true
    search_terms: [devops engineer, site reliability engineer, platform engineer, cloud engineer,
                   kubernetes engineer, infrastructure engineer, devsecops engineer]
    pages: 2
  # IamExpat (FETCH 7, sweep/sources/iamexpat.py): the IT and technology jobs page (its search
  # box ignores the search word), newest 20 jobs, one request a sweep, robots.txt respected.
  # Netherlands only; titles outside the target roles are dropped by normalize.
  iamexpat:
    enabled: true
  # Full descriptions (sweep/fulltext.py): the job page is read for new jobs near the top of
  # today's list that only have a snippet or nothing. Plain GET, no login or cookies, public
  # https hosts only, never linkedin, at most 3 MB a page.
  fulltext:
    enabled: true
    # Jobs read beyond today's room (daily_new_limit minus jobs already added), so a job whose
    # full text matches better can still move into the best 30.
    lookahead: 15
    max_pages: 45
    # Jobs about to be saved whose page the rounds above never reached are read too (at most
    # this many), so no saved job is left without a description (Pracuj.pl alerts, 7 Oct).
    saved_max_pages: 30
    # Saved Unscreened rows with no description get their page read after each sweep (at
    # most this many), so jobs saved before PR #97 can still be screened (8 Oct).
    backfill_pages: 20
    # gmail: the job links in alert emails (JustJoin IT, NoFluffJobs, Pracuj.pl, ...) are
    # followed to the real job page, whose link and full description are kept. LinkedIn is
    # never read, whatever this says.
    sources: [adzuna, ats, jooble, nofluffjobs, iamexpat, gmail]
