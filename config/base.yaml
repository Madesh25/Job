safety:
  redirect_to: "madeshwaranm02@gmail.com"
  dev_sender: "madeshwaranm02@gmail.com"
  prod_sender: "madeshwaran.manikam@gmail.com"
  # Every HTTP request made through jobengine.http must go to one of these hosts.
  # linkedin hosts are refused even if listed here.
  allowed_hosts:
    - api.notion.com
    - api.adzuna.com
    - boards-api.greenhouse.io
    - api.lever.co
    - api.eu.lever.co
    - api.smartrecruiters.com
    - ind.nl
    - api.apollo.io
    - api.hunter.io
    - api.snov.io
screening:
  # A description shorter than this (or marked "(snippet only)") is a snippet (spec section 3).
  full_min_chars: 600
  # /jd collects pasted messages for this long before the capture is discarded.
  jd_capture_minutes: 20
  # /jd writes the pasted text in blocks of this size, at most this many blocks.
  block_chars: 2000
  max_blocks: 90
resume:
  # Defaults; Notion Config keys with the same names (resume.fill_min, ...) win when set.
  fill_min: 88
  fill_max: 96
  max_revisions: 5
  gate_retries: 2
  max_words_per_bullet: 8
  max_words_total: 25
  # Words allowed around a backed term in an inserted chunk (resume.gate.connector_words).
  # One string: in a YAML list the word "on" would be read as true.
  connector_words: "and with using for on in the a an via to of across including through into by
    its their"
  out_dir: out
contacts:
  # Title patterns (lowercase regex), checked in this order. Anything else is Other.
  title_patterns:
    recruiter: "recruit|talent acquisition|sourcer|talent partner|people partner|hr business partner|rekrut"
    hiring: "engineering manager|head of (devops|platform|infrastructure|cloud|sre|engineering)|director of (engineering|infrastructure|platform)|(devops|platform|infrastructure|sre|cloud) (team )?(lead|manager)|tech lead|team lead"
    peer: "devops|site reliability|sre|platform engineer|cloud engineer|infrastructure engineer|systems engineer|kubernetes|release engineer|build engineer"
  # Used when Config contacts.mix is missing or cannot be read.
  default_mix: {peer: 2, hiring: 1, recruiter: 1}
  cache_months: 6
  personal_domains: [gmail.com, outlook.com, yahoo.com, hotmail.com, icloud.com, proton.me]
  generic_mailboxes: [careers, jobs, hr, recruitment, talent, praca, rekrutacja]
  # Never used as a company's email domain.
  ats_hosts: [greenhouse.io, lever.co, smartrecruiters.com, myworkdayjobs.com, workday.com,
              teamtailor.com, recruitee.com, personio.de]
  # Title keywords sent to providers per slot type.
  search_titles:
    peer: [DevOps Engineer, Site Reliability Engineer, Platform Engineer, Cloud Engineer]
    hiring: [Engineering Manager, Head of Platform, Head of DevOps, Infrastructure Manager]
    recruiter: [Recruiter, Talent Acquisition, Technical Recruiter]
drive:
  resume_folder: Job Engine Resumes
mail:
  # Defaults; Notion Config keys mail.same_person_cooldown_days and mail.max_attachment_kb win.
  same_person_cooldown_days: 30
  max_attachment_kb: 250
sweep:
  # Title filters (section 4). Matched as whole words on the canonical (lowercase ASCII) title.
  title_include:
    - devops
    - sre
    - site reliability
    - platform engineer
    - cloud engineer
    - infrastructure engineer
    - infra engineer
    - kubernetes
    - systems engineer
    - build engineer
    - release engineer
    - devsecops
    - cloud ops
    - cloudops
  title_exclude:
    - lead
    - principal
    - head of
    - director
    - manager
    - architect
    - staff
    - intern
    - internship
    - student
  # Country -> names and cities. City keys are the display names written to Notion;
  # aliases are canonical (lowercase ASCII, as produced by normalize.canon).
  locations:
    Poland:
      names: [poland, polska]
      cities:
        Warszawa: [warszawa, warsaw]
        Kraków: [krakow, cracow]
        Wrocław: [wroclaw]
        Poznań: [poznan]
        Gdańsk: [gdansk]
        Łódź: [lodz]
        Katowice: [katowice]
    Netherlands:
      names: [netherlands, nederland]
      cities:
        Amsterdam: [amsterdam]
        Amstelveen: [amstelveen]
        Utrecht: [utrecht]
        Rotterdam: [rotterdam]
        Den Haag: [den haag, the hague, s gravenhage]
        Eindhoven: [eindhoven]
    Ireland:
      names: [ireland]
      cities:
        Dublin: [dublin]
        Cork: [cork]
        Galway: [galway]
        Limerick: [limerick]
  gmail:
    query: "newer_than:2d -in:spam -in:trash from:(linkedin.com OR justjoin.it OR nofluffjobs.com OR pracuj.pl OR theprotocol.it OR bulldogjob.pl OR indeed.com OR iamexpat.nl OR nationalevacaturebank.nl OR irishjobs.ie OR jobs.ie OR jobsireland.ie)"
    max_messages: 100
    # Sender domain (or parent domain) -> Board option in Job Opportunities.
    sender_boards:
      linkedin.com: LinkedIn
      justjoin.it: JustJoin IT
      nofluffjobs.com: NoFluffJobs
      pracuj.pl: Pracuj.pl
      theprotocol.it: theprotocol.it
      bulldogjob.pl: Bulldogjob
      indeed.com: Indeed
      iamexpat.nl: IamExpat
      nationalevacaturebank.nl: Nationale Vacaturebank
      irishjobs.ie: IrishJobs.ie
      jobs.ie: Jobs.ie
      jobsireland.ie: JobsIreland
    # Board -> job link pattern. The last capturing group is the posting ID.
    # These are only used to recognise links inside emails; links are never requested.
    job_url_patterns:
      LinkedIn: 'linkedin\.com/(comm/)?jobs/view/(\d+)'
      JustJoin IT: 'justjoin\.it/(job-offer|offers)/([\w-]+)'
      NoFluffJobs: 'nofluffjobs\.com/(pl/)?job/([\w-]+)'
      Pracuj.pl: 'pracuj\.pl/praca/.*,oferta,(\d+)'
    # Anchor texts that are never job titles (generic fallback for other boards).
    ignore_link_texts:
      - unsubscribe
      - view all
      - see all
      - settings
      - manage
      - preferences
      - privacy
      - help
      - terms
      - log in
      - sign in
      - download
      - app store
      - google play
  adzuna:
    countries: [pl, nl]
    # Adzuna results carry no currency field; each country endpoint reports salaries
    # in that country's currency.
    currency:
      pl: PLN
      nl: EUR
    results_per_page: 50
    max_days_old: 3
    what_or: "devops sre kubernetes platform cloud infrastructure"
    max_calls_per_run: 6
  ats:
    max_detail_calls: 20
  # Company name -> {ats, token} for companies whose careers URL is their own domain.
  ats_boards: {}
